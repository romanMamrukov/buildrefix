<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BuildReFix Operations</title><style>body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:16px;background:#f5f6f8;color:#17212b}form,article{background:white;padding:16px;border:1px solid #ccd3da;border-radius:10px;margin:12px 0}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;margin:4px}small{display:block}h1{font-size:24px}</style><h1>BuildReFix — Lead Register</h1><p>Локальный реестр. Не вводите имена, телефоны, пароли или другие персональные данные. Используйте внутренний ID. Данные остаются в браузере; экспортируйте резервную копию. Не загружайте рабочие данные в GitHub.</p><p id="summary"></p><form id="form"><label>ID / описание без персональных данных<input name="title" required maxlength="160"></label><label>Источник<select name="source"><option>Facebook</option><option>Google</option><option>AI Search</option><option>Referral</option><option>Other</option></select></label><label>Услуга<select name="service"><option>Smart Home</option><option>Wi-Fi</option><option>Computer Repair</option><option>Remote Support</option><option>Website</option><option>Automation</option><option>Business IT</option></select></label><label>Следующий контакт<input name="next" type="date"></label><label>Сумма предложения EUR<input name="quote" type="number" min="0" step=".01" value="0"></label><button>Добавить лид</button></form><button id="export">Экспорт JSON</button><label>Восстановить JSON<input id="import" type="file" accept=".json,application/json"></label><div id="list"></div><script>
const key='brx-ops-v1', statuses=['new','qualified','quoted','booked','paid','lost'];let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))rows=[]}catch{}const $=id=>document.getElementById(id);const money=n=>Math.round(n*100)/100;function save(){try{localStorage.setItem(key,JSON.stringify(rows))}catch(e){alert('Не удалось сохранить. Экспортируйте JSON.')}render()}function node(tag,t){const e=document.createElement(tag);e.textContent=t;return e}function render(){const month=new Date().toISOString().slice(0,7),paid=rows.filter(r=>r.status==='paid'&&r.paidDate?.startsWith(month));$('summary').textContent='Лиды: '+rows.length+' | Оплачено за месяц: €'+money(paid.reduce((s,r)=>s+r.received,0))+' | Прямые расходы: €'+money(paid.reduce((s,r)=>s+r.cost,0))+' | Часы: '+money(paid.reduce((s,r)=>s+r.hours,0));$('list').replaceChildren();for(const r of rows){const a=node('article','');a.append(node('strong',r.title),node('small',r.source+' · '+r.service+' · €'+r.quote));for(const [k,label,type] of [['next','Следующий контакт','date'],['received','Получено EUR','number'],['cost','Расход EUR','number'],['hours','Часы','number'],['paidDate','Дата оплаты','date']]){const l=node('label',label),i=document.createElement('input');i.type=type;i.value=r[k]??'';if(type==='number'){i.min=0;i.step='.01'}i.onchange=()=>{r[k]=type==='number'?Math.max(0,Number(i.value)||0):i.value;save()};l.append(i);a.append(l)}const s=document.createElement('select');for(const v of statuses){const o=node('option',v);o.value=v;s.append(o)}s.value=r.status;s.onchange=()=>{r.status=s.value;if(r.status==='paid'&&!r.paidDate)r.paidDate=new Date().toISOString().slice(0,10);save()};a.append(s);const d=node('button','Удалить');d.onclick=()=>{if(confirm('Удалить запись?')){rows=rows.filter(x=>x!==r);save()}};a.append(d);$('list').append(a)}}$('form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));rows.unshift({...f,quote:Number(f.quote),status:'new',received:0,cost:0,hours:0,paidDate:''});save();e.target.reset()};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='buildrefix-leads.json';a.click();URL.revokeObjectURL(u)};$('import').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(r=>r&&typeof r.title==='string'&&typeof r.source==='string'&&typeof r.service==='string'&&statuses.includes(r.status)&&['quote','received','cost','hours'].every(k=>Number.isFinite(r[k])&&r[k]>=0)))throw Error();if(confirm('Заменить текущие записи?')){rows=x;save()}}catch{alert('Некорректный файл')}};render();
</script></html>
